<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Символ · Ваш этаж (прототип механики)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'Bounded';src:url('fonts/Bounded-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
  :root{--violet:#5703AC;--lilac:#A879E8;--glow:#D9CCF5;--night:#110163}
  *{margin:0;padding:0;box-sizing:border-box}
  a,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Jost',sans-serif;background:#0A0140;color:#fff;overflow:hidden;overscroll-behavior:none}
  .d{font-family:'Bounded',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.03em}

  .stage{position:fixed;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,1,64,.55),transparent 28%,transparent 70%,rgba(10,1,64,.7));pointer-events:none}

  /* загрузка */
  .ldr{position:absolute;inset:0;z-index:20;background:#0A0140;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;transition:opacity .6s,visibility .6s}
  .ldr.done{opacity:0;visibility:hidden}
  .ldr .pct{font-family:'Bounded',sans-serif;font-size:2.2rem;color:var(--glow)}
  .ldr .cap{font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.5)}

  /* шапка */
  .top{position:absolute;left:0;right:0;top:0;z-index:5;padding:max(1rem,env(safe-area-inset-top)) 1.2rem 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  .top .eyebrow{font-size:.66rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--glow)}
  .top h1{font-size:1.25rem;line-height:1.2;margin-top:.35rem}
  .proto{pointer-events:auto;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(17,1,99,.55);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:.4rem .7rem;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);white-space:nowrap}

  /* рельса этажей */
  .rail{position:absolute;right:.6rem;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column-reverse;gap:.15rem;padding:.4rem .3rem;background:rgba(17,1,99,.42);border:1px solid rgba(255,255,255,.22);border-radius:999px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .rail button{width:34px;height:26px;border:none;background:transparent;color:rgba(255,255,255,.55);font-family:'Jost',sans-serif;font-size:.72rem;font-weight:500;border-radius:999px;cursor:pointer;transition:color .2s,background .2s}
  .rail button.on{background:#fff;color:var(--night);font-weight:600}
  @media (max-height:700px){.rail button{height:22px;font-size:.66rem}}

  /* подпись этажа */
  .info{position:absolute;left:1.2rem;right:4.5rem;bottom:max(1.4rem,env(safe-area-inset-bottom));z-index:6}
  .info .floor{font-family:'Bounded',sans-serif;font-size:clamp(2.6rem,12vw,4.4rem);line-height:1;color:#fff;text-shadow:0 2px 24px rgba(10,1,64,.7)}
  .info .floor small{font-family:'Jost',sans-serif;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:var(--glow);display:block;margin-bottom:.3rem}
  .info .h{margin-top:.5rem;font-size:.9rem;color:rgba(255,255,255,.8)}
  .info .hint{margin-top:.9rem;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.45)}
  .ctrl{display:flex;gap:.5rem;margin-top:1rem}
  .ctrl button{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(17,1,99,.45);color:#fff;font-size:1.1rem;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .ctrl button:active{background:var(--violet)}
  .ctrl a{margin-left:auto;align-self:center;font-size:.72rem;color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4)}

  .back{position:absolute;left:1.2rem;top:max(1rem,env(safe-area-inset-top));z-index:7;font-size:.66rem;color:#fff;text-decoration:none;opacity:.7}
</style>
</head>
<body>

<div class="stage">
  <canvas id="cv"></canvas>
  <div class="shade"></div>
  <div class="ldr" id="ldr"><div class="pct" id="pct">0%</div><div class="cap">Поднимаемся</div></div>

  <div class="top">
    <div style="padding-top:1.6rem">
      <p class="eyebrow">Леонов · Ижевск</p>
      <h1 class="d">Ваш этаж</h1>
    </div>
    <span class="proto" title="Кадры — съёмка фасада с земли. Для вида из окна нужна дрон-съёмка по ТЗ">Прототип · фасад, не вид</span>
  </div>

  <div class="rail" id="rail" role="tablist" aria-label="Этаж"></div>

  <div class="info">
    <div class="floor"><small>этаж</small><span id="fl">1</span></div>
    <div class="h" id="fh">≈ 3 м над двором</div>
    <div class="ctrl">
      <button type="button" id="up" aria-label="Выше">▲</button>
      <button type="button" id="down" aria-label="Ниже">▼</button>
      <a href="index.html#projects">← к превью</a>
    </div>
    <div class="hint">Свайп по кадру · тап по этажу · стрелки</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
(function(){
  const FRAMES = 63, FLOORS = 16, H = 3;                 /* 3 м на этаж — для подписи */
  const SRC = i => 'img/okno/w_' + String(i + 1).padStart(3, '0') + '.webp';
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const ldr = document.getElementById('ldr'), pct = document.getElementById('pct');
  const rail = document.getElementById('rail'), flEl = document.getElementById('fl'), fhEl = document.getElementById('fh');
  const bmps = new Array(FRAMES); let loaded = 0, cur = -1;
  const pos = { f: 0 };                                   /* дробный кадр — его твинит GSAP */
  let floor = 1;

  /* --- рисование (cover) --- */
  function draw(i){
    const im = bmps[i]; if (!im || !cv.width) return; cur = i;
    const iw = im.width || im.naturalWidth, ih = im.height || im.naturalHeight;
    const cw = cv.width, ch = cv.height, ir = iw / ih, cr = cw / ch;
    let w, h, x, y;
    if (ir > cr){ h = ch; w = h * ir; x = (cw - w) / 2; y = 0; } else { w = cw; h = w / ir; x = 0; y = (ch - h) / 2; }
    ctx.drawImage(im, x, y, w, h);
  }
  function resize(){
    const d = Math.min(devicePixelRatio || 1, 2);
    cv.width = cv.clientWidth * d; cv.height = cv.clientHeight * d;
    if (cur >= 0) draw(cur);
  }
  addEventListener('resize', resize);

  /* --- предзагрузка с декодированием (ImageBitmap) --- */
  function loadFrame(i){
    const viaImg = () => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = SRC(i); });
    const p = window.createImageBitmap ? fetch(SRC(i)).then(r => r.blob()).then(b => createImageBitmap(b)).catch(viaImg) : viaImg();
    p.then(im => { bmps[i] = im; loaded++; pct.textContent = Math.round(loaded / FRAMES * 100) + '%'; if (loaded === FRAMES) start(); });
  }
  for (let i = 0; i < FRAMES; i++) loadFrame(i);

  /* --- этаж ↔ кадр --- */
  const frameOf = fl => (fl - 1) / (FLOORS - 1) * (FRAMES - 1);
  function setFloor(fl, instant){
    fl = Math.max(1, Math.min(FLOORS, fl));
    floor = fl;
    flEl.textContent = fl;
    fhEl.textContent = '≈ ' + (fl * H) + ' м над двором';
    rail.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.fl === fl));
    /* «лифт»: едем по промежуточным кадрам, а не прыгаем */
    gsap.killTweensOf(pos);
    if (instant){ pos.f = frameOf(fl); draw(Math.round(pos.f)); return; }
    gsap.to(pos, { f: frameOf(fl), duration: .35 + Math.abs(frameOf(fl) - pos.f) / (FRAMES - 1) * .9, ease: 'power2.inOut',
      onUpdate(){ const i = Math.round(pos.f); if (i !== cur) draw(i); } });
  }

  /* рельса этажей */
  for (let fl = 1; fl <= FLOORS; fl++){
    const b = document.createElement('button'); b.type = 'button'; b.dataset.fl = fl; b.textContent = fl; b.setAttribute('role', 'tab');
    b.addEventListener('click', () => setFloor(fl));
    rail.appendChild(b);
  }
  /* протяжка пальцем по рельсе */
  let railDrag = false;
  const railPick = e => { const el = document.elementFromPoint(e.clientX, e.clientY); if (el && el.dataset && el.dataset.fl) setFloor(+el.dataset.fl); };
  rail.addEventListener('pointerdown', e => { railDrag = true; railPick(e); });
  addEventListener('pointermove', e => { if (railDrag) railPick(e); });
  addEventListener('pointerup', () => { railDrag = false; });

  /* свайп по кадру: вверх — выше, вниз — ниже (как тянешь лифт) */
  let swY = null, swF = 0;
  cv.addEventListener('pointerdown', e => { swY = e.clientY; swF = pos.f; gsap.killTweensOf(pos); });
  addEventListener('pointermove', e => {
    if (swY === null) return;
    const dy = swY - e.clientY;                           /* палец вверх → положительно */
    pos.f = Math.max(0, Math.min(FRAMES - 1, swF + dy / innerHeight * (FRAMES - 1) * 1.6));
    const i = Math.round(pos.f); if (i !== cur) draw(i);
    const fl = Math.round(pos.f / (FRAMES - 1) * (FLOORS - 1)) + 1;
    if (fl !== floor){ floor = fl; flEl.textContent = fl; fhEl.textContent = '≈ ' + (fl * H) + ' м над двором';
      rail.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.fl === fl)); }
  });
  addEventListener('pointerup', () => { if (swY === null) return; swY = null; setFloor(floor); /* доезжаем ровно до этажа */ });

  document.getElementById('up').addEventListener('click', () => setFloor(floor + 1));
  document.getElementById('down').addEventListener('click', () => setFloor(floor - 1));
  addEventListener('keydown', e => { if (e.key === 'ArrowUp') setFloor(floor + 1); if (e.key === 'ArrowDown') setFloor(floor - 1); });

  function start(){
    resize();
    ldr.classList.add('done');
    setFloor(1, true);
    /* демонстрация: через секунду сами поднимаемся на 9-й, чтобы было понятно, что тут происходит */
    setTimeout(() => setFloor(9), 900);
  }
})();
</script>
</body>
</html>
